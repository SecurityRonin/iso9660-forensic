[package]
name = "iso9660-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Command-line tool for forensic inspection of ISO 9660 / Rock Ridge / Joliet disc images"
license = "MIT"
repository = "https://github.com/SecurityRonin/iso9660-forensic"
homepage = "https://github.com/SecurityRonin/iso9660-forensic"
keywords = ["forensics", "iso", "iso9660", "cli", "disk-image"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "iso9660"
path = "src/main.rs"

[lib]
name = "iso9660_cli"
path = "src/lib.rs"

[dependencies]
iso9660-forensic = { path = "../iso", version = "0.3.0", package = "iso9660-forensic" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
