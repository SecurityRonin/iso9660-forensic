[package]
name          = "iso9660-forensic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description   = "Forensic ISO 9660 reader and tamper analyzer: analyse() surfaces 23 anomaly findings across multi-session, Rock Ridge, Joliet, El Torito, and raw 2352-byte CD images"
license.workspace = true
repository.workspace = true
homepage      = "https://github.com/SecurityRonin/iso9660-forensic"
documentation = "https://docs.rs/iso9660-forensic"
authors       = ["Albert Hui"]
keywords      = ["forensics", "iso9660", "disk-image", "optical", "security"]
categories    = ["parser-implementations", "filesystem"]
exclude       = ["/tests", "corpus/"]

[features]
test-helpers = []
serde = ["dep:serde", "forensicnomicon/serde"]
# Adapt `IsoReader` to the forensic-vfs `FileSystem` trait (see `src/vfs.rs`) so
# an ISO 9660 volume composes as `Arc<dyn FileSystem>` in the forensic-vfs engine.
vfs = ["dep:forensic-vfs"]

[dependencies]
forensicnomicon.workspace = true
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
safe-read = { workspace = true }
# forensic-vfs (KNOWLEDGE leaf) — the read-only FileSystem navigation contract.
# Optional so a bare reader stays dependency-light; the `vfs` feature turns on
# the adapter.
forensic-vfs = { version = "0.7", optional = true }

# Untrusted-input ISO 9660 / optical-image parser: never panic on a malformed
# image. Production code must not `.unwrap()`/`.expect()` (fixed-width reads route
# through `safe-read`). Tests opt out: lib.rs `cfg_attr(test, allow(..))` for the
# lib's own test modules, and a per-file top-level allow in each integration test.
# (The workspace `[workspace.lints]` table is not inherited here — enabling it
# would surface unrelated dormant pedantic warnings — so the panic-free denies
# live at member scope where they take effect.)
[lints.clippy]
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }

[dev-dependencies]
tempfile   = { workspace = true }
hadris-iso = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
