[package]
name          = "iso9660-forensic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description   = "Forensic ISO 9660 reader and tamper analyzer: analyse() surfaces 23 anomaly findings across multi-session, Rock Ridge, Joliet, El Torito, and raw 2352-byte CD images"
license.workspace = true
repository.workspace = true
homepage      = "https://github.com/SecurityRonin/iso9660-forensic"
documentation = "https://docs.rs/iso9660-forensic"
authors       = ["Albert Hui"]
keywords      = ["forensics", "iso9660", "disk-image", "optical", "security"]
categories    = ["parser-implementations", "filesystem"]
exclude       = ["/tests", "corpus/"]

[features]
test-helpers = []
serde = ["dep:serde", "forensicnomicon/serde"]

[dependencies]
forensicnomicon.workspace = true
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
sha1 = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
hadris-iso = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
