[package]
name         = "iso9660-forensic"
version      = "0.2.0"
edition      = "2021"
rust-version = "1.85"
description  = "Pure-Rust forensic ISO reader: multi-session, UDF, Rock Ridge, Joliet, El Torito, 2352-byte raw sectors"
license      = "MIT"
repository   = "https://github.com/SecurityRonin/iso9660-forensic"
homepage     = "https://github.com/SecurityRonin/iso9660-forensic"
documentation = "https://docs.rs/iso9660-forensic"
authors      = ["Albert Hui"]
keywords     = ["forensics", "iso", "iso9660", "udf", "disk-image"]
categories   = ["parser-implementations", "filesystem"]

[features]
test-helpers = []
serde = ["dep:serde", "udf-forensic/serde"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10"
sha1 = "0.10"
hfsplus-forensic = "0.1"
apm-forensic = "0.1"
udf-forensic = "0.1"

[dev-dependencies]
tempfile   = "3"
hadris-iso = "1"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
