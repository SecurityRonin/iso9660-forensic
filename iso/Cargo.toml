[package]
name         = "iso"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
description  = "Pure-Rust forensic ISO reader: multi-session, UDF, Rock Ridge, Joliet, El Torito, 2352-byte raw sectors"
license      = "MIT"
repository   = "https://github.com/SecurityRonin/iso"
homepage     = "https://github.com/SecurityRonin/iso"
documentation = "https://docs.rs/iso"
authors      = ["Albert Hui"]
keywords     = ["forensics", "iso", "iso9660", "udf", "disk-image"]
categories   = ["parser-implementations", "filesystem"]

[features]
test-helpers = []

[dependencies]
thiserror = "2"

[dev-dependencies]
tempfile   = "3"
hadris-iso = "1"
