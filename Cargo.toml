[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for fields shared by every member (DRY): bump version /
# MSRV / license here once; members inherit via `field.workspace = true`.
[workspace.package]
version = "0.7.6"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/iso9660-forensic"
homepage = "https://github.com/SecurityRonin/iso9660-forensic"
readme = "README.md"

# Single source of truth for dependency versions (DRY): declare each once;
# members write `dep.workspace = true`.
[workspace.dependencies]
iso9660-forensic-core = { version = "0.1.0", path = "core" }
forensicnomicon = "1"
forensic-vfs = { version = "0.9" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3"
hadris-iso = "1"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
# Single audited bounds-checked integer-read helper (fleet standard): fixed-width
# reads return 0 out of range instead of panicking. Used to remove infallible
# `try_into().unwrap()` conversions from the untrusted-input parsers.
safe-read = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = { level = "deny", priority = 0 }
expect_used              = { level = "deny", priority = 0 }
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
items_after_statements   = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
manual_let_else          = { level = "allow", priority = 1 }
