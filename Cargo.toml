[workspace]
resolver = "2"
members = ["iso"]

# Single source of truth for fields shared by every member (DRY): bump version /
# MSRV / license here once; members inherit via `field.workspace = true`.
[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/iso9660-forensic"

# Single source of truth for dependency versions (DRY): declare each once;
# members write `dep.workspace = true`.
[workspace.dependencies]
forensicnomicon = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3"
hadris-iso = "1"
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic                    = { level = "warn", priority = -1 }
module_name_repetitions     = "allow"
must_use_candidate          = "allow"
missing_errors_doc          = "allow"
missing_panics_doc          = "allow"
cast_possible_truncation    = "allow"
cast_possible_wrap          = "allow"
cast_sign_loss              = "allow"
# Stylistic pedantic lints the codebase deliberately favours: building report
# strings with `push_str(&format!(..))`, widening casts written explicitly,
# product names in docs, and dense report-builder functions.
cast_lossless               = "allow"
doc_markdown                = "allow"
format_push_string          = "allow"
too_many_lines              = "allow"
needless_pass_by_value      = "allow"
