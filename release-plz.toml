# release-plz owns crates.io publishing + changelog + version bumps for the single
# published LIBRARY `iso9660-forensic` (combined reader + analyzer). It runs on
# pushes to main (see .github/workflows/release-plz.yml):
#   - `release-pr`  opens a human-reviewed version-bump PR (conventional commits)
#   - `release`     publishes the crate when its Cargo.toml version is ahead of
#                   crates.io and creates its git tag
#
# The `iso-fuzz` member carries its own [workspace] and is not part of this
# workspace, so release-plz never sees it.

[workspace]
# Per-package git tag, e.g. `iso9660-forensic-v0.7.3`. A `<name>-v…` tag has a
# letter (not a digit) after the first `v`, so it never collides with a `v[0-9]*`
# binary-release trigger.
git_tag_enable = true
# The library crate gets a git tag + CHANGELOG entry, not a GitHub Release.
git_release_enable = false
changelog_update = true
# Only prepare a release when a real change exists since the last one. This
# allowlist makes feat/fix/perf/refactor/doc/revert the only release triggers;
# chore/ci/test/style/build (incl. release-plz's own release commits) never prepare
# a release (kills the changelog-churn loop).
release_commits = "^(feat|fix|perf|refactor|doc|revert)"

[changelog]
commit_parsers = [
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^refactor", group = "other" },
    { message = "^doc", group = "documentation" },
    { message = "^revert", group = "other" },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^chore", skip = true },
    { message = "^.*", group = "other" },
]
