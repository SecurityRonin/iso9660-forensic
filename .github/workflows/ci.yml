name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@a62ab10603151071744cec0b4e3638aa6406d4e4
    with:
      # Carries the existing decision across rather than changing it: the old
      # coverage job ran
      #   cargo llvm-cov --workspace --all-features --fail-under-lines 95
      # so 95 is this repo's deliberate, already-agreed floor. Inheriting the
      # default strict gate here would raise the bar inside an adoption PR,
      # which is a behaviour change and not an adoption.
      # `floor` is a migration state, not the standard: an aggregate cannot
      # honour a per-line `// cov:unreachable` exemption. Moving off it is
      # separate work.
      coverage-gate: floor
      coverage-floor: 95

  # Carried across VERBATIM from the previous ci.yml. This is repo-specific
  # reporting, not a gate — note `continue-on-error: true` and the trailing
  # `|| true`; it publishes an unsafe-usage census and never blocks a merge.
  # The shared workflow has no equivalent, so it stays here.
  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
